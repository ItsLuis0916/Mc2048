game:
  sizes: [4, 6, 8]
  start-tiles: 2
  win-value: 2048
  four-chance: 0.1
  undo-cooldown: 2

player-defaults:
  sound: true
  volume: 100
  volume-step: 10
  confetti: true
  glow: true
  animations: true

camera:
  distance: 3.2
  lens-offset: 0.5
  hint-clear-ticks: 2
  zoom:
    default: 1.5
    min: 0.6
    max: 2.5
    step: 1.1
    ticks: 3
  clear:
    radius: 8
    up: 7
    down: 7

animation:
  slide-ticks: 2
  settle-ticks: 1
  pop-ticks: 2
  pop-scale: 1.2
  appear-ticks: 3
  float-ticks: 12
  float-distance: 60
  cursor-ticks: 1
  confetti:
    count: 40
    min-size: 9
    max-size: 15
    spread: 260
    fall: 320
    burst-ticks: 8
    fall-ticks: 26
    colors: ['#edc22e', '#f65e3b', '#f2b179', '#f67c5f', '#edcf72', '#eee4da']

layout:
  unit: 0.0055
  layer: 0.002
  backdrop:
    size: 12000
    color: '#000000'
  page:
    width: 560
    height: 730
    color: '#faf8ef'
  title:
    x: 30
    y: 30
    width: 240
    height: 100
    text-height: 58
  score:
    x: 305
    y: 40
    width: 110
    height: 60
    color: '#bbada0'
    label-y: 17
    label-height: 9
    value-y: 41
    value-height: 18
  best:
    x: 420
    y: 40
    width: 110
    height: 60
    color: '#bbada0'
    label-y: 17
    label-height: 9
    value-y: 41
    value-height: 18
  zoom-out:
    x: 30
    y: 140
    width: 40
    height: 40
    text-height: 13
  zoom-in:
    x: 80
    y: 140
    width: 40
    height: 40
    text-height: 13
  leave:
    x: 180
    y: 140
    width: 100
    height: 40
    text-height: 13
  undo:
    x: 290
    y: 140
    width: 100
    height: 40
    text-height: 13
  restart:
    x: 400
    y: 140
    width: 130
    height: 40
    text-height: 13
  settings-button:
    x: 506
    y: 16
    width: 36
    height: 36
    color: '#f9f6f2'
  prefs:
    title-y: 100
    title-height: 40
    row-y: 190
    row-gap: 80
    row-height: 46
    label-x: 160
    label-height: 14
    control-x: 300
    control-width: 200
    step-width: 46
    text-height: 13
  menu:
    title-y: 110
    title-height: 70
    subtitle-y: 190
    subtitle-height: 14
    card-y: 250
    margin: 14
    card-gap: 15
    pad: 12
    cell: 20
    cell-gap: 3
    name-y: 28
    name-height: 26
    preview-y: 56
    best-gap: 18
    best-height: 11
    back:
      x: 205
      y: 650
      width: 150
      height: 40
      text-height: 13
  button:
    color: '#8f7a66'
    hover: '#a08a76'
    disabled: '#d6cdc4'
  board:
    x: 30
    y: 200
    size: 500
    gap: 15
    reference-size: 4
    color: '#bbada0'
    cell: '#cdc1b4'
  overlay:
    won: '#80edc22e'
    over: '#baeee4da'
    text-y: 200
    text-height: 43
    button-y: 290
    button-width: 130
    button-height: 40
    button-gap: 10
    button-text-height: 13
  float:
    text-height: 18
  hint:
    y: 755
    text-height: 12
  cursor:
    size: 14
    border: 3
    color: '#ffffff'
    border-color: '#776e65'
  tiles:
    glow:
      from: 128
      color: '#f3d774'
      min-alpha: 0.25
      max-alpha: 0.6
      margin: 9
    text-height:
      1: 40
      2: 40
      3: 32
      4: 25
      5: 20
    colors:
      2: ['#eee4da', '#776e65']
      4: ['#ede0c8', '#776e65']
      8: ['#f2b179', '#f9f6f2']
      16: ['#f59563', '#f9f6f2']
      32: ['#f67c5f', '#f9f6f2']
      64: ['#f65e3b', '#f9f6f2']
      128: ['#edcf72', '#f9f6f2']
      256: ['#edcc61', '#f9f6f2']
      512: ['#edc850', '#f9f6f2']
      1024: ['#edc53f', '#f9f6f2']
      2048: ['#edc22e', '#f9f6f2']
      super: ['#3c3a32', '#f9f6f2']

sounds:
  merge-pitch-step: 0.1
  merge-pitch-max: 1.0
  events:
    open:
      - {sound: 'minecraft:block.note_block.chime', volume: 0.45, pitch: 1.2}
      - {sound: 'minecraft:block.note_block.pling', volume: 0.25, pitch: 1.8}
    close:
      - {sound: 'minecraft:block.note_block.chime', volume: 0.35, pitch: 0.9}
    slide:
      - {sound: 'minecraft:block.note_block.hat', volume: 0.2, pitch: 1.7}
    merge:
      - {sound: 'minecraft:block.note_block.pling', volume: 0.35, pitch: 0.8}
      - {sound: 'minecraft:block.note_block.hat', volume: 0.15, pitch: 1.7}
    blocked:
      - {sound: 'minecraft:block.note_block.bass', volume: 0.25, pitch: 0.8}
    click:
      - {sound: 'minecraft:ui.button.click', volume: 0.2, pitch: 1.6}
    undo:
      - {sound: 'minecraft:item.book.page_turn', volume: 0.8, pitch: 1.1}
    restart:
      - {sound: 'minecraft:ui.button.click', volume: 0.2, pitch: 1.6}
      - {sound: 'minecraft:block.note_block.chime', volume: 0.3, pitch: 1.5}
    won:
      - {sound: 'minecraft:ui.toast.challenge_complete', volume: 0.45, pitch: 1.0}
    over:
      - {sound: 'minecraft:block.note_block.bass', volume: 0.45, pitch: 0.6}
      - {sound: 'minecraft:block.note_block.didgeridoo', volume: 0.25, pitch: 0.6}
