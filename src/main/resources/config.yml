game:
  sizes: [4, 6, 8]
  start-tiles: 2
  win-value: 2048
  four-chance: 0.1
  undo-cooldown: 2

player-defaults:
  sound: true
  volume: 100
  volume-step: 10
  confetti: true
  glow: true
  animations: true
  theme: classic

camera:
  distance: 3.2
  lens-offset: 0.5
  hint-clear-ticks: 2
  zoom:
    default: 1.5
    min: 0.6
    max: 2.5
    step: 1.1
    ticks: 3
  clear:
    radius: 8
    up: 7
    down: 7

animation:
  slide-ticks: 2
  settle-ticks: 1
  pop-ticks: 2
  pop-scale: 1.2
  appear-ticks: 3
  float-ticks: 12
  float-distance: 60
  cursor-ticks: 1
  confetti:
    count: 40
    min-size: 9
    max-size: 15
    spread: 260
    fall: 320
    burst-ticks: 8
    fall-ticks: 26
    colors: ['#edc22e', '#f65e3b', '#f2b179', '#f67c5f', '#edcf72', '#eee4da']

